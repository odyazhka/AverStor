[package]
name = "averstor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "averstor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.27"
image = { version = "0.24", default-features = false, features = ["webp", "jpeg"] }
mimalloc = "0.1"
base64 = "0.22"
rfd = "0.14"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
